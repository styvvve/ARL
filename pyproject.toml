[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-reliability-lab"
version = "0.0.0"
description = "Agent Reliability Lab : assistant de notes locales, fil rouge du cours sur les agents d'IA"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
arl = "arl.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
